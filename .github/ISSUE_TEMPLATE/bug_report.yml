name: Bug report
description: Report a reproducible problem in Mornye.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please remove personal information from screenshots and logs. Do not attach private music, credentials or your full library. Report security vulnerabilities privately to zarzet@mornye.com."
  - type: input
    id: version
    attributes:
      label: Mornye version and build
      placeholder: 0.1 Open Beta (2)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: iPhone model + iOS version, or Mac model + macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Frequency, workaround, appearance mode, player state, audio format/output, or a redacted screenshot.
